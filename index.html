    :root {
      --hot-pink: #ff47a3;

      --text-pink: #d62976;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .font-bubble { font-family: 'DynaPuff', system-ui, cursive; }
    .font-email { font-family: 'Caveat', cursive; }
    .font-sans-bold { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 0.04em; }

    .glossy-pill {
      background-color: var(--pastel-pink);
      color: var(--text-pink);
      border-radius: 9999px;
      position: relative;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 3px 10px rgba(255, 194, 220, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .glossy-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 71, 163, 0.35);
    }
    .glossy-pill::after {
      content: '';
      position: absolute;
      top: 7px;
      right: 16px;
      width: 16px;
      height: 6px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      transform: rotate(20deg);
      pointer-events: none;
    }
    .glossy-pill::before {
      content: '';
      position: absolute;
      top: 6px;
      right: 36px;
      width: 5px;
      height: 4px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      pointer-events: none;
    }

    .enter-btn {
      background-color: var(--hot-pink);
      color: white;
      font-weight: 700;
      border-radius: 999px;
      padding: 6px 32px;
      box-shadow: 0 4px 0 #ffffff, 0 6px 15px rgba(255, 71, 163, 0.4);
      transition: all 0.15s ease;
    }
    .enter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #ffffff;
    }

    .stamp-container {
      background: var(--hot-pink);
      padding: 16px;
      position: relative;
      -webkit-mask-image: radial-gradient(circle at 9px 9px, transparent 9px, black 9.5px);
      -webkit-mask-position: -9px -9px;
      -webkit-mask-size: 28px 28px;
      mask-image: radial-gradient(circle at 9px 9px, transparent 9px, black 9.5px);
      mask-position: -9px -9px;
      mask-size: 28px 28px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #ff47a3; border-radius: 99px; }
  </style>

    function showNotice(title, message, icon = "💌") {
      document.getElementById("noticeIcon").innerText = icon;

    function openEditorModal(title, fieldsHTML, onSave) {
      document.getElementById("editorTitle").innerText = title;
      document.getElementById("editorFields").innerHTML = fieldsHTML;
      const btn = document.getElementById("editorSaveBtn");
      btn.onclick = () => {

      document.getElementById("editorModal").classList.add("hidden");

    /*************************************************************************
     * REAL-TIME MULTI-DEVICE SYNC (Prevents devices from showing different counts!)
     *************************************************************************/
    async function syncFromDB(rerender = true) {
      if (!dbClient) return;
      try {
        const { data, error } = await dbClient.from("ruri_space").select("content").eq("id", 1).single();
        if (data && data.content) {
          appData = data.content;
          localStorage.setItem("ruri_space_data", JSON.stringify(appData));
          if (rerender) render();
        } else if (error) {
          await dbClient.from("ruri_space").upsert({ id: 1, content: appData });
        }

        // Also sync visitor logs across devices
        const { data: vData } = await dbClient.from("visitor_logs").select("*").order("created_at", { ascending: false }).limit(50);
        if (vData) {
          visitorLogs = vData.map(v => ({
            name: v.name,
            reason: v.reason,
            date: new Date(v.created_at).toLocaleString()
          }));
          localStorage.setItem("ruri_visitor_logs", JSON.stringify(visitorLogs));
        }
      } catch (e) {}
    }

    // Mutate Safely: Always pulls latest cloud data BEFORE adding/editing so tablet & phone never overwrite each other!
    async function updateCloudData(mutatorFn) {
      if (dbClient) {
        try {
          const { data } = await dbClient.from("ruri_space").select("content").eq("id", 1).single();
          if (data && data.content) {
            appData = data.content;
          }
        } catch (e) {}
      }

      mutatorFn(appData);

      localStorage.setItem("ruri_space_data", JSON.stringify(appData));
      render();

      if (dbClient) {
        try {
          await dbClient.from("ruri_space").upsert({ id: 1, content: appData });
        } catch (e) {}
      }
    }

    // Subscribe to live database changes + background refresh every 6 seconds if user is not typing
    if (dbClient) {
      dbClient
        .channel("ruri_live_sync")
        .on("postgres_changes", { event: "*", schema: "public", table: "ruri_space" }, (payload) => {
          if (payload.new && payload.new.content) {
            appData = payload.new.content;
            localStorage.setItem("ruri_space_data", JSON.stringify(appData));
            const activeTag = document.activeElement ? document.activeElement.tagName : "";
            if (activeTag !== "INPUT" && activeTag !== "TEXTAREA") {
              render();
            }
          }
        })
        .subscribe();

      setInterval(() => {
        const activeTag = document.activeElement ? document.activeElement.tagName : "";
        if (activeTag !== "INPUT" && activeTag !== "TEXTAREA") {
          syncFromDB(true);
        }
      }, 6000);
    }

      document.getElementById("profileMenu").classList.add("hidden");

        pendingTargetView = view;
        openAuthModal("category", "This section is private. Enter Ruri's login or use an access code.");
        return;
      }

      currentView = view;
      syncFromDB(true);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function lockStickerSVG(unlocked = false) {
      return `
        <div class="absolute -bottom-2 -right-2 w-9 h-9 pointer-events-none drop-shadow">
          <svg viewBox="0 0 100 100" class="w-full h-full">
            <path d="M35 45 V30 C35 18 65 18 65 30 V45" fill="none" stroke="#ff47a3" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 2"/>
            <path d="M50 88 C50 88 18 68 18 46 C18 34 30 28 40 35 C45 38 48 42 50 45 C52 42 55 38 60 35 C70 28 82 34 82 46 C82 68 50 88 50 88 Z" fill="#ffc2dc" stroke="#ff47a3" stroke-width="4"/>

    async function handleEnterSpace() {
      const nameInput = document.getElementById("landingName").value.trim();
      const reasonInput = document.getElementById("landingReason").value.trim();

      if (!nameInput || !reasonInput) {
        showNotice("Wait a second!", "Please tell Ruri your name and why you want to enter her space first.", "✨");
        return;
      }

      visitorName = nameInput;
      visitorReason = reasonInput;
      localStorage.setItem("ruri_visitor_name", visitorName);
      localStorage.setItem("ruri_visitor_reason", visitorReason);

      visitorLogs.unshift({ name: visitorName, reason: visitorReason, date: new Date().toLocaleString() });
      localStorage.setItem("ruri_visitor_logs", JSON.stringify(visitorLogs));

      if (dbClient) {
        try { await dbClient.from("visitor_logs").insert({ name: visitorName, reason: visitorReason }); } catch (e) {}
      }

      navigate("menu");
    }

    }

    function toggleBucketDone(idx) {
      updateCloudData(data => { data.bucketList[idx].done = !data.bucketList[idx].done; });
    }

    function addBucketItem() {
      const text = document.getElementById("newBucketText").value.trim();
      if (!text) return;
      updateCloudData(data => data.bucketList.push({ text, done: false }));
    }

    function editBucketItem(idx) {
      openEditorModal("Edit Bucket List Goal", `
        <input id="modalEditBucket" value="${appData.bucketList[idx].text.replace(/"/g, '&quot;')}" class="w-full bg-black border border-pink-400 rounded-lg px-3 py-2 text-white"/>
      `, () => {
        const val = document.getElementById("modalEditBucket").value.trim();
        if (val) updateCloudData(data => { data.bucketList[idx].text = val; });
      });
    }

    function saveCapsule() {
      const val = document.getElementById("capsuleEditor").value;
      updateCloudData(data => { data.timeCapsule = val; });
      showNotice("Time Capsule Sealed!", "Your Time Capsule entry has been saved across all devices.", "🕰️");
    }

    function submitPublicQuestion() {
      const text = document.getElementById("publicQuestionInput").value.trim();
      if (!text) return;
      updateCloudData(data => data.publicQuestions.unshift({ id: Date.now(), from: visitorName || "Guest", text, reply: "" }));
    }

    function editQuestion(idx) {
      const q = appData.publicQuestions[idx];
      openEditorModal("Edit Question", `
        <textarea id="modalEditQText" rows="3" class="w-full bg-black border border-pink-400 rounded-lg px-3 py-2 text-white">${q.text}</textarea>
      `, () => {
        const val = document.getElementById("modalEditQText").value.trim();
        if (val) updateCloudData(data => { data.publicQuestions[idx].text = val; });
      });
    }

    function replyToQuestion(idx) {
      const reply = document.getElementById(`replyInput_${idx}`).value.trim();
      updateCloudData(data => { data.publicQuestions[idx].reply = reply; });
    }

    function toggleUnknownEmailBox() {
      document.getElementById("unknownEmailDrawer").classList.toggle("hidden");
    }

    function sendUnknownEmail() {
      const text = document.getElementById("unknownEmailText").value.trim();
      if (!text) return;
      updateCloudData(data => {
        if (!data.unknownEmails) data.unknownEmails = [];
        data.unknownEmails.unshift({
          id: Date.now(),
          date: new Date().toLocaleDateString("en-US"),
          text
        });
      });
      showNotice(
        "Unknown Email Sent! 🎀",
        "Guaranteed 100% Anonymous: Your name and identity were never recorded.\n\nThis message is locked inside Ruri's private inbox—only Ruri can read it.",
        "🔒"
      );
    }

    function resetToDefault() {
      openEditorModal("Reset All Content?", `
        <p class="text-zinc-300">Are you sure you want to restore all default diary entries?</p>
      `, () => {
        updateCloudData(data => {
          Object.assign(data, JSON.parse(JSON.stringify(defaultData)));
        });
      });
    }

    render();
    syncFromDB(true);
  </script>
</body>
</html>
